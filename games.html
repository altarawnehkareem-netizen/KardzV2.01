<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      height: 100%;
      background-image: linear-gradient(to bottom, black 0%, black 5%, transparent 50%), linear-gradient(45deg, black, purple);
    }
    body { font-family: system-ui, sans-serif; color: #eee; height: 100%; margin: 0; }

    .header {
      padding: 20px 24px;
      display: grid;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .header h1 { font-size: 20px; margin-right: auto; }
    .search {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #141414;
      color: #eee;
      font-size: 14px;
      outline: none;
      min-width: 220px;
      transition: border-color .2s, box-shadow .2s;
    }
    .search:focus {
      border-color: #ae00ff;
      box-shadow: 0 0 0 3px rgba(174, 0, 255, 0.18);
    }

    .categories {
      display: flex;
      gap: 8px;
      padding: 0 24px 16px;
      overflow-x: auto;
    }
    .cat-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #333;
      background: #141414;
      color: #999;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .cat-btn:hover, .cat-btn.active {
      background: #ae00ff;
      color: #000;
      border-color: #7700ff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      padding: 0 24px 24px;
    }

    .card {
      position: relative;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      background: #1a1a1a;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card .name {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px;
      background: linear-gradient(to top, rgba(0,0,0,.85), transparent);
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      transition: opacity .15s;
    }
    .card:hover .name { opacity: 1; }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 0 24px 32px;
    }
    .page-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #141414;
      color: #eee;
      font-size: 13px;
      cursor: pointer;
    }
    .page-btn:hover, .page-btn.active {
      background: #a200ff;
      color: #000;
      border-color: #b700ff;
    }
    .page-btn:disabled { opacity: .3; cursor: default; }

    .loading { text-align: center; padding: 60px; color: #555; }
  </style>
</head>
<body>
  <br><br>
  <div style="text-align: center;">
    <a href="index.html" style="color: rgb(255, 255, 255); font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; font-size: x-large; text-decoration: none;">Back</a>
  </div>
  <br><br>
  <div class="header">
    <h1>My Games</h1>
    <input class="search" type="text" placeholder="Search games...">
  </div>
  <div class="categories"></div>
  <div class="grid" id="grid"></div>
  <div class="pagination" id="pagination"></div>

  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const pagination = document.getElementById('pagination');
    const searchInput = document.querySelector('.search');
    const catBar = document.querySelector('.categories');

    const PAGE_SIZE = 24;
    let currentPage = 1;
    let currentQuery = '';
    let currentCategory = '';

    // ---- Init ----
    (async () => {
      await Lumin.init({
        headless: true,
        onReady: () => console.log('Lumin connected'),
        onError: (err) => console.error('Lumin error:', err),
      });

      // Load categories
      const { categories } = await Lumin.getCategories();
      renderCategories(['All', ...categories]);

      // Load first page
      await loadPage(1);
    })();

    // ---- Search (debounced) ----
    let debounce;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        currentQuery = e.target.value.trim();
        currentPage = 1;
        loadPage(1);
      }, 300);
    });

    // ---- Categories ----
    function renderCategories(cats) {
      catBar.innerHTML = '';
      cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn' + (cat === 'All' && !currentCategory ? ' active' : '');
        btn.textContent = cat;
        btn.onclick = () => {
          currentCategory = cat === 'All' ? '' : cat;
          currentPage = 1;
          catBar.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadPage(1);
        };
        catBar.appendChild(btn);
      });
    }

    // ---- Load & render a page ----
    async function loadPage(page) {
      grid.innerHTML = '<div class="loading">Loading...</div>';
      pagination.innerHTML = '';

      const result = await Lumin.getGames({
        page,
        limit: PAGE_SIZE,
        q: currentQuery,
      });

      currentPage = page;
      grid.innerHTML = '';

      // Render cards, resolving images in parallel
      const imgUrls = await Promise.all(
        result.games.map(g => Lumin.getImageUrl(g.image_token))
      );

      result.games.forEach((game, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${imgUrls[i]}" alt="${game.name}" loading="lazy">
          <div class="name">${game.name}</div>
        `;
        card.onclick = () => Lumin.loadGame(game.id);
        grid.appendChild(card);
      });

      // Pagination
      renderPagination(result.pages);
    }

    function renderPagination(totalPages) {
      pagination.innerHTML = '';
      if (totalPages <= 1) return;

      const prev = document.createElement('button');
      prev.className = 'page-btn';
      prev.textContent = 'Prev';
      prev.disabled = currentPage === 1;
      prev.onclick = () => loadPage(currentPage - 1);
      pagination.appendChild(prev);

      for (let p = 1; p <= totalPages; p++) {
        const btn = document.createElement('button');
        btn.className = 'page-btn' + (p === currentPage ? ' active' : '');
        btn.textContent = p;
        btn.onclick = () => loadPage(p);
        pagination.appendChild(btn);
      }

      const next = document.createElement('button');
      next.className = 'page-btn';
      next.textContent = 'Next';
      next.disabled = currentPage === totalPages;
      next.onclick = () => loadPage(currentPage + 1);
      pagination.appendChild(next);
    }
  </script>
</body>
</html>
